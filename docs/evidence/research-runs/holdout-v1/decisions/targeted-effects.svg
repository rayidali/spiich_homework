<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img"><title>Prespecified targeted component effects</title><desc>Percentage-point differences; error bars are unadjusted clustered empirical intervals. N/A indicates unavailable uncertainty. No production winner.</desc><rect width="1100" height="600" fill="white"/><g font-family="sans-serif" font-size="13" fill="#152331"><text x="20" y="28">holdout-v1 — HELD-OUT / DESCRIPTIVE</text><line x1="500" y1="65" x2="500" y2="535" stroke="#8797a6"/><line x1="517.5" y1="65" x2="517.5" y2="535" stroke="#b87412" stroke-dasharray="4 4"/><text x="150" y="58" text-anchor="middle">-100pp</text><text x="325" y="58" text-anchor="middle">-50pp</text><text x="500" y="58" text-anchor="middle">0pp</text><text x="675" y="58" text-anchor="middle">50pp</text><text x="850" y="58" text-anchor="middle">100pp</text><text x="12" y="92">H1: R1−R0</text><line x1="459.1666666666667" x2="675" y1="88" y2="88" stroke="#245870" stroke-width="2"/><circle cx="564.1666666666666" cy="88" r="4" fill="#245870"/><text x="870" y="92">18.3 [-11.7, 50.0]pp</text><text x="870" y="108" font-size="11">inconclusive</text><text x="12" y="141">H2: R2−R1</text><line x1="622.5" x2="710" y1="137" y2="137" stroke="#245870" stroke-width="2"/><circle cx="663.3333333333334" cy="137" r="4" fill="#245870"/><text x="870" y="141">46.7 [35.0, 60.0]pp</text><text x="870" y="157" font-size="11">candidate for further experiment</text><text x="12" y="190">H3a: R3−R2</text><line x1="482.5" x2="581.6666666666666" y1="186" y2="186" stroke="#245870" stroke-width="2"/><circle cx="535" cy="186" r="4" fill="#245870"/><text x="870" y="190">10.0 [-5.0, 23.3]pp</text><text x="870" y="206" font-size="11">inconclusive</text><text x="12" y="239">H3b: R3−R4</text><line x1="494.1666666666667" x2="558.3333333333334" y1="235" y2="235" stroke="#245870" stroke-width="2"/><circle cx="523.3333333333334" cy="235" r="4" fill="#245870"/><text x="870" y="239">6.7 [-1.7, 16.7]pp</text><text x="870" y="255" font-size="11">inconclusive</text><text x="12" y="288">H4: R4−R2</text><line x1="488.3333333333333" x2="535" y1="284" y2="284" stroke="#245870" stroke-width="2"/><circle cx="511.6666666666667" cy="284" r="4" fill="#245870"/><text x="870" y="288">3.3 [-3.3, 10.0]pp</text><text x="870" y="304" font-size="11">inconclusive</text><text x="12" y="337">H5: R5−R4</text><line x1="476.6666666666667" x2="511.6666666666667" y1="333" y2="333" stroke="#245870" stroke-width="2"/><circle cx="494.1666666666667" cy="333" r="4" fill="#245870"/><text x="870" y="337">-1.7 [-6.7, 3.3]pp</text><text x="870" y="353" font-size="11">below practical target</text><text x="12" y="386">H6: R6−R4</text><line x1="354.1666666666667" x2="488.3333333333333" y1="382" y2="382" stroke="#245870" stroke-width="2"/><circle cx="430" cy="382" r="4" fill="#245870"/><text x="870" y="386">-20.0 [-41.7, -3.3]pp</text><text x="870" y="402" font-size="11">below practical target</text><text x="12" y="435">H7a: R7−R4</text><line x1="478.6111111111111" x2="501.94444444444446" y1="431" y2="431" stroke="#245870" stroke-width="2"/><circle cx="490.27777777777777" cy="431" r="4" fill="#245870"/><text x="870" y="435">-2.8 [-6.1, 0.6]pp</text><text x="870" y="451" font-size="11">inconclusive</text><text x="12" y="484">H7b: R8−R4</text><line x1="480.55555555555554" x2="505.8333333333333" y1="480" y2="480" stroke="#245870" stroke-width="2"/><circle cx="494.1666666666667" cy="480" r="4" fill="#245870"/><text x="870" y="484">-1.7 [-5.6, 1.7]pp</text><text x="870" y="500" font-size="11">inconclusive</text><text x="20" y="564">Gold dashed line: +5pp practical target (H1–H6); H7 uses the separate reviewer criterion.</text><text x="20" y="586">Point benefit and uncertainty are distinct. N/A intervals are not zero. No deployment recommendation.</text></g></svg>