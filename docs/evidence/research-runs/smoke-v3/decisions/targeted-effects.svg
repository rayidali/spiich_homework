t x="12" y="386">H6: R6−R4</text><circle cx="675" cy="382" r="4" fill="#245870"/><text x="870" y="386">50.0 [N/A, N/A]pp</text><text x="870" y="402" font-size="11">ineligible</text><text x="12" y="435">H7a: R7−R4</text><circle cx="441.6666666666667" cy="431" r="4" fill="#245870"/><text x="870" y="435">-16.7 [N/A, N/A]pp</text><text x="870" y="451" font-size="11">ineligible</text><text x="12" y="484">H7b: R8−R4</text><circle cx="500" cy="480" r="4" fill="#245870"/><text x="870" y="484">0.0 [N/A, N/A]pp</text><text x="870" y="500" font-size="11">ineligible</text><text x="20" y="564">Gold dashed line: +5pp practical target (H1–H6); H7 uses the separate reviewer criterion.</text><text x="20" y="586">Point benefit and uncertainty are distinct. N/A intervals are not zero. No deployment recommendation.</text></g></svg>