<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="496" viewBox="0 0 1020 496" role="img" aria-labelledby="title desc"><title id="title">Required-document coverage and end-to-end availability</title><desc id="desc">Blue is mean conditional selected-document recall; gold is all-required-documents availability in released outcomes. Different denominators are printed. N/A means unmeasured.</desc><style>text{font:13px sans-serif;fill:#18242c}</style><rect width="100%" height="100%" fill="white"/><text x="12" y="23" style="font-size:17px;font-weight:bold">Required-document coverage — pilot-v1</text><text x="240" y="43">0%</text><text x="785" y="43">100%</text><text x="12" y="74">R0 Current control</text><rect x="240" y="62" width="0" height="12" fill="#245f76"/><rect x="240" y="77" width="0" height="12" fill="#c08a2d"/><text x="830" y="74">N/A (n=0)</text><text x="830" y="90">0.0% (n=4)</text><text x="12" y="116">R1 Broad tools</text><rect x="240" y="104" width="0" height="12" fill="#245f76"/><rect x="240" y="119" width="0" height="12" fill="#c08a2d"/><text x="830" y="116">N/A (n=0)</text><text x="830" y="132">0.0% (n=4)</text><text x="12" y="158">R2 Lexical documents</text><rect x="240" y="146" width="570" height="12" fill="#245f76"/><rect x="240" y="161" width="427.5" height="12" fill="#c08a2d"/><text x="830" y="158">100.0% (n=4)</text><text x="830" y="174">75.0% (n=4)</text><text x="12" y="200">R3 Managed File Search</text><rect x="240" y="188" width="570" height="12" fill="#245f76"/><rect x="240" y="203" width="427.5" height="12" fill="#c08a2d"/><text x="830" y="200">100.0% (n=4)</text><text x="830" y="216">75.0% (n=4)</text><text x="12" y="242">R4 Custom hybrid</text><rect x="240" y="230" width="570" height="12" fill="#245f76"/><rect x="240" y="245" width="427.5" height="12" fill="#c08a2d"/><text x="830" y="242">100.0% (n=4)</text><text x="830" y="258">75.0% (n=4)</text><text x="12" y="284">R5 Jev reranking</text><rect x="240" y="272" width="570" height="1